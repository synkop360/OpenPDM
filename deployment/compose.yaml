services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openpdm}
      POSTGRES_USER: ${POSTGRES_USER:-openpdm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openpdm}
    ports:
      - "${OPENPDM_PG_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openpdm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-openpdm}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-openpdm-secret}
    ports:
      - "${OPENPDM_MINIO_HOST_PORT:-9000}:9000"
      - "${OPENPDM_MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      OPENPDM_ENV: development
      OPENPDM_DATABASE_URL: postgresql+psycopg://openpdm:openpdm@postgres:5432/openpdm
      # Blob storage target. Defaults reproduce the bundled-MinIO stack; a named
      # deployment's env file overrides these to point at external S3 or the
      # local filesystem (see scripts/deployments.py).
      OPENPDM_S3_ENDPOINT_URL: ${OPENPDM_S3_ENDPOINT_URL:-http://minio:9000}
      OPENPDM_S3_BUCKET: ${OPENPDM_S3_BUCKET:-openpdm-blobs}
      OPENPDM_S3_ACCESS_KEY: ${OPENPDM_S3_ACCESS_KEY:-openpdm}
      OPENPDM_S3_SECRET_KEY: ${OPENPDM_S3_SECRET_KEY:-openpdm-secret}
      OPENPDM_BLOB_LOCAL_ROOT: /var/lib/openpdm/blobs
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      OPENPDM_PLUGIN_PACKAGE_ROOT: /var/lib/openpdm/plugins
      # Persist Wasmtime's compiled-artifact cache across restarts. The first
      # activation of a CPython-based plugin component compiles for seconds; a
      # warm cache turns that into a millisecond deserialize so a cold `enable`
      # or `analyze` does not race OPENPDM_PLUGIN_RUNTIME_TIMEOUT_SECONDS. The
      # raised deadline below is headroom for the first (cold) invocation.
      OPENPDM_PLUGIN_RUNTIME_CACHE_DIR: /var/lib/openpdm/plugin-cache
      OPENPDM_PLUGIN_RUNTIME_TIMEOUT_SECONDS: "30"
    volumes:
      - plugin-packages:/var/lib/openpdm/plugins
      - plugin-cache:/var/lib/openpdm/plugin-cache
      # Only read when OPENPDM_S3_ENDPOINT_URL is a file:// URL (local storage
      # deployments). Otherwise an inert mount. Source is a named volume by
      # default; a deployment may point it at an absolute host path instead.
      - ${OPENPDM_BLOB_LOCAL_SOURCE:-openpdm-blobs-data}:/var/lib/openpdm/blobs
    ports:
      - "${OPENPDM_BACKEND_HOST_PORT:-18000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

volumes:
  postgres-data:
  minio-data:
  plugin-packages:
  plugin-cache:
  openpdm-blobs-data:
