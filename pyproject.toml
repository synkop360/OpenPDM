[project]
name = "openpdm"
version = "0.0.0"
description = "Open-source Engineering Collaboration Platform documentation package."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
  "ruff>=0.8,<0.9",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
extend-exclude = [
  ".codex",
  ".codex-token-benchmark",
  ".gitnexus",
  ".kilo",
  ".memoire",
  ".superpowers",
  ".tmp",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501", "UP037"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
